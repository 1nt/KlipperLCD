# Network management macros for Klipper and KlipperLCD

[gcode_macro GET_IP]
description: Display host IP address
gcode:
    RESPOND TYPE=command MSG="__KLIPPERLCD_NET_GET_IP__"

[gcode_macro WIFI_SCAN]
description: Scan available WiFi networks
gcode:
    RESPOND TYPE=command MSG="__KLIPPERLCD_NET_WIFI_SCAN__"

[gcode_macro WIFI_STATUS]
description: Show current WiFi connection status
gcode:
    RESPOND TYPE=command MSG="__KLIPPERLCD_NET_WIFI_STATUS__"

[gcode_macro WIFI_CONNECT]
description: Connect to WiFi: WIFI_CONNECT SSID="name" PASS="pass" or WIFI_CONNECT ID=1 PASS="pass"
gcode:
    {% set ssid = params.SSID|default("") %}
    {% set id = params.ID|default("") %}
    {% set target = ssid if ssid != "" else id %}
    {% set pass = params.PASS|default(params.PASSWORD|default("")) %}
    {% if target == "" %}
        RESPOND TYPE=error MSG="Usage: WIFI_CONNECT SSID=\"name\" [PASS=\"pass\"] or WIFI_CONNECT ID=1 [PASS=\"pass\"]"
    {% else %}
        RESPOND TYPE=command MSG="__KLIPPERLCD_NET_WIFI_CONNECT__ TARGET='{target}' PASS='{pass}'"
    {% endif %}
